<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý Thiết bị Thí nghiệm</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;color:#333;padding:16px}
  .container{max-width:1400px;margin:0 auto}
  h1{color:#1a5490;margin-bottom:16px;text-align:center;font-size:22px}

  .sync-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;
    background:#fff;border-radius:8px;margin-bottom:14px;font-size:13px;
    box-shadow:0 2px 5px rgba(0,0,0,.08)}
  .sync-bar .dot{width:10px;height:10px;border-radius:50%;background:#28a745;flex-shrink:0}
  .sync-bar.dirty .dot{background:#ffc107;animation:pulse 1s infinite}
  .sync-bar.error .dot{background:#dc3545}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tab{padding:10px 18px;border:none;border-radius:8px 8px 0 0;
    background:#e1e5ea;color:#555;cursor:pointer;font-weight:600;font-size:13px}
  .tab.active{background:#1a5490;color:#fff}
  .tab-content{display:none}
  .tab-content.active{display:block}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;
    background:#fff;padding:10px;border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,.08)}
  .toolbar input,.toolbar select{padding:7px 10px;border:1px solid #ccc;
    border-radius:6px;font-size:13px}
  .toolbar input[type=text]{flex:1;min-width:180px}
  .date-group{display:flex;gap:6px;align-items:center;
    padding:6px 10px;background:#f5f8ff;border-radius:6px;font-size:12px}
  .date-group label{color:#555;font-weight:600}
  .date-group input[type=date]{padding:5px 8px;font-size:12px}
  button{padding:8px 14px;border:none;border-radius:6px;cursor:pointer;
    font-size:13px;font-weight:600;transition:.2s}
  .btn-primary{background:#1a5490;color:#fff}
  .btn-primary:hover{background:#0f3a6a}
  .btn-danger{background:#dc3545;color:#fff}
  .btn-warning{background:#ffc107;color:#333}
  .btn-success{background:#28a745;color:#fff}
  .btn-secondary{background:#6c757d;color:#fff}
  button:disabled{opacity:.5;cursor:not-allowed}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;margin-bottom:14px}
  .stat-card{background:#fff;padding:12px;border-radius:8px;text-align:center;
    box-shadow:0 2px 5px rgba(0,0,0,.08)}
  .stat-card .num{font-size:22px;font-weight:bold;color:#1a5490}
  .stat-card .label{font-size:11px;color:#666;margin-top:4px}

  .table-wrap{overflow-x:auto;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  table{width:100%;border-collapse:collapse;min-width:800px}
  th{background:#1a5490;color:#fff;padding:10px 8px;text-align:left;font-size:12px;white-space:nowrap}
  td{padding:8px;border-bottom:1px solid #eee;font-size:12px;vertical-align:middle}
  tr:hover{background:#f8f9ff}

  .badge{display:inline-block;padding:3px 8px;border-radius:12px;
    font-size:11px;font-weight:600;white-space:nowrap}
  .badge-red{background:#ffe0e0;color:#c00}
  .badge-yellow{background:#fff4d0;color:#a67c00}
  .badge-green{background:#d4f4dd;color:#1a6b2e}
  .code-cell{font-family:monospace;font-weight:bold;color:#1a5490;font-size:12px}

  .thumb{width:40px;height:40px;object-fit:cover;border-radius:4px;
    cursor:pointer;border:1px solid #ddd;margin-right:2px}
  .thumb-empty{width:40px;height:40px;border:1px dashed #ccc;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    color:#aaa;font-size:10px;white-space:nowrap}

  .row-actions button{padding:4px 8px;font-size:11px;margin-right:2px}

  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
    z-index:1000;align-items:center;justify-content:center;padding:15px}
  .modal-bg.active{display:flex}
  .modal{background:#fff;border-radius:10px;padding:22px;max-width:680px;
    width:100%;max-height:92vh;overflow-y:auto}
  .modal h2{color:#1a5490;margin-bottom:14px;font-size:18px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-group{display:flex;flex-direction:column}
  .form-group.full{grid-column:1/-1}
  .form-group label{font-size:12px;font-weight:600;margin-bottom:4px;color:#555}
  .form-group label .req{color:#dc3545}
  .form-group input,.form-group select,.form-group textarea{
    padding:8px;border:1px solid #ccc;border-radius:6px;font-size:13px}
  .form-group input.uppercase{text-transform:uppercase;font-family:monospace}
  .hint{font-size:11px;color:#888;margin-top:3px}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

  .autocomplete-wrap{position:relative}
  .autocomplete-wrap input{padding-right:32px;width:100%}
  .autocomplete-wrap input.uppercase{text-transform:uppercase}
  .ac-toggle{position:absolute;right:1px;top:1px;bottom:1px;width:30px;
    background:#eef4fb;border:none;border-left:1px solid #ddd;border-radius:0 6px 6px 0;
    cursor:pointer;color:#1a5490;font-size:11px}
  .ac-toggle:hover{background:#dce8f5}
  .ac-list{display:none;position:absolute;top:100%;left:0;right:0;
    background:#fff;border:1px solid #1a5490;border-radius:6px;max-height:240px;
    overflow-y:auto;z-index:100;box-shadow:0 4px 14px rgba(0,0,0,.18);margin-top:2px}
  .ac-list.show{display:block}
  .ac-item{padding:8px 12px;cursor:pointer;font-size:13px;
    border-bottom:1px solid #f0f0f0;color:#222}
  .ac-item:last-child{border-bottom:none}
  .ac-item:hover,.ac-item.active{background:#eef4fb;color:#1a5490}
  .ac-item.new{color:#1a5490;font-style:italic;font-weight:600;
    background:#f0f7ff;border-top:2px dashed #b0c8e0}
  .ac-item.new:hover{background:#e0efff}
  .ac-count{font-size:10px;color:#888;float:right;font-weight:normal}
  .ac-empty{padding:12px;color:#999;text-align:center;font-size:12px}

  .img-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .img-preview .img-wrap{position:relative;width:76px;text-align:center}
  .img-preview img{width:70px;height:70px;object-fit:cover;
    border-radius:6px;border:1px solid #ddd;background:#f5f5f5;display:block;margin:0 auto}
  .img-preview .ph{width:70px;height:70px;border-radius:6px;background:#eef4fb;
    display:flex;align-items:center;justify-content:center;font-size:11px;
    color:#1a5490;margin:0 auto;border:1px dashed #b0c8e0}
  .img-preview .del-img{position:absolute;top:-6px;right:2px;background:#dc3545;
    color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;
    line-height:1;cursor:pointer;border:none;padding:0;z-index:2}
  .img-preview .prog{font-size:9px;color:#1a5490;margin-top:2px;
    display:block;line-height:1.2}
  .img-preview .prog.ok{color:#28a745}
  .img-preview .prog.err{color:#dc3545}
  .img-preview .img-wrap.uploading img{opacity:.55}
  .img-preview .img-wrap.uploading .ph{animation:pulse 1.2s infinite}

  .dash-grid{display:grid;grid-template-columns:1fr;gap:18px}
  .dash-card{background:#fff;border-radius:10px;padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .dash-card h3{color:#1a5490;margin-bottom:12px;font-size:15px;
    display:flex;align-items:center;gap:8px}
  .dash-card h3 .hint{font-size:12px;color:#888;font-weight:normal}
  .dash-table{width:100%;border-collapse:collapse}
  .dash-table th{background:#eef4fb;color:#1a5490;padding:9px 8px;
    text-align:center;font-size:12px;border-bottom:2px solid #1a5490}
  .dash-table th:first-child{text-align:left}
  .dash-table td{padding:8px;border-bottom:1px solid #eee;
    font-size:12px;text-align:center}
  .dash-table td:first-child{text-align:left;font-weight:600}
  .dash-table .num-big{font-weight:bold;color:#1a5490;font-size:13px}
  .dash-table .pct-good{color:#28a745;font-weight:bold}
  .dash-table .pct-warn{color:#ffc107;font-weight:bold}
  .dash-table .pct-bad{color:#dc3545;font-weight:bold}
  .dash-table tr.total-row td{background:#f5f8ff;font-weight:bold;
    border-top:2px solid #1a5490}
  .progress{width:80px;height:6px;background:#e9ecef;border-radius:3px;
    display:inline-block;vertical-align:middle;margin-left:6px;overflow:hidden}
  .progress > div{height:100%;background:#28a745}

  .lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);
    z-index:2000;align-items:center;justify-content:center}
  .lightbox.active{display:flex}
  .lightbox img{max-width:92%;max-height:92%;border-radius:6px}
  .lightbox .close-lb{position:absolute;top:12px;right:22px;color:#fff;
    font-size:38px;cursor:pointer;line-height:1}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:#333;color:#fff;padding:12px 20px;border-radius:8px;
    font-size:13px;z-index:3000;opacity:0;transition:opacity .3s;
    max-width:90%;text-align:center}
  .toast.show{opacity:1}
  .toast.success{background:#28a745}
  .toast.error{background:#dc3545}
  .toast.warn{background:#ffc107;color:#333}

  @media(max-width:768px){
    .form-grid{grid-template-columns:1fr}
    body{padding:10px}
    .date-group{flex-wrap:wrap;width:100%}
  }
</style>
</head>
<body>
<div class="container">
  <h1>🔬 Quản lý Thiết bị Thí nghiệm</h1>

  <div class="sync-bar" id="syncBar">
    <span class="dot"></span>
    <span id="syncText" style="flex:1">Đang tải dữ liệu...</span>
    <button class="btn-primary" id="btnSync" onclick="syncNow()" disabled>☁️ Đồng bộ ngay</button>
    <button class="btn-success" onclick="loadFromServer(true)">🔄 Tải lại</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="list" onclick="switchTab('list')">📋 Danh sách</button>
    <button class="tab" data-tab="dashboard" onclick="switchTab('dashboard')">📊 Dashboard</button>
  </div>

  <div id="tabList" class="tab-content active">
    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <input type="text" id="searchBox" placeholder="🔍 Tìm theo tên / mã / trạm...">
      <select id="filterStation"><option value="">-- Tất cả trạm --</option></select>
      <select id="filterReport">
        <option value="">-- All --</option>
        <option value="Chưa làm">Chưa làm</option>
        <option value="Đang làm">Đang làm</option>
        <option value="Đã xong">Đã xong</option>
      </select>
      <div class="date-group">
        <label>📅</label>
        <select id="filterDateField">
          <option value="testDate">Ngày TN</option>
          <option value="samplingDate">Ngày lấy mẫu</option>
        </select>
        <span>Từ</span>
        <input type="date" id="filterDateFrom">
        <span>→</span>
        <input type="date" id="filterDateTo">
        <button class="btn-secondary" onclick="clearDateFilter()" title="Xóa lọc ngày">✕</button>
      </div>
      <button class="btn-primary" onclick="openAddModal()">➕ Thêm thiết bị</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>STT</th><th>Trạm</th><th>Mã TB</th><th>Tên thiết bị</th>
            <th>Ngày lấy mẫu</th><th>Ngày TN</th>
            <th>Ảnh KQ</th><th>Nameplate</th><th>Biên bản</th><th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <div id="tabDashboard" class="tab-content">
    <div class="dash-grid">
      <div class="dash-card">
        <h3>🏢 Thống kê theo Trạm</h3>
        <div id="dashByStation"></div>
      </div>
      <div class="dash-card">
        <h3>📅 Thống kê theo Tháng</h3>
        <div id="dashByMonth"></div>
      </div>
      <div class="dash-card">
        <h3>🎯 Ma trận Trạm × Tháng</h3>
        <div id="dashMatrix" style="overflow-x:auto"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">Thêm thiết bị</h2>
    <form id="equipmentForm" onsubmit="saveEquipment(event)">
      <input type="hidden" id="eqId">
      <div class="form-grid">
        <div class="form-group">
          <label>Trạm <span class="req">*</span></label>
          <div class="autocomplete-wrap">
            <input type="text" id="fStation" required class="uppercase"
                   placeholder="Gõ hoặc chọn trạm..."
                   autocomplete="off"
                   oninput="onStationInput(this.value)"
                   onfocus="onStationFocus()">
            <button type="button" class="ac-toggle" onclick="toggleStationList(event)"
                    tabindex="-1">▼</button>
            <div class="ac-list" id="stationDropdown"></div>
          </div>
          <!--div class="hint">Chọn từ danh sách hoặc gõ tên mới</div-->
        </div>
        <div class="form-group">
          <label>Chỉ danh thiết bị <span class="req">*</span></label>
          <input type="text" id="fCode" required class="uppercase"
                 placeholder="VD: TB-001"
                 oninput="this.value=this.value.toUpperCase()">
          <!--div class="hint">Tự IN HOA. Trùng mã OK nếu khác trạm.</div-->
        </div>
        <div class="form-group full">
          <label>Tên thiết bị <span style="color:#888;font-weight:normal">(không bắt buộc)</span></label>
          <input type="text" id="fName" class="uppercase"
                 placeholder="MÁY CẮT"
                 oninput="this.value=this.value.toUpperCase()">
        </div>
        <div class="form-group">
          <label>Ngày lấy mẫu</label>
          <input type="date" id="fSamplingDate">
        </div>
        <div class="form-group">
          <label>Ngày thí nghiệm</label>
          <input type="date" id="fTestDate">
        </div>
        <div class="form-group full">
          <label>Trạng thái biên bản</label>
          <select id="fReport">
            <option value="Chưa làm">Chưa làm</option>
            <option value="Đang làm">Đang làm</option>
            <option value="Đã xong">Đã xong</option>
          </select>
        </div>
        <div class="form-group full">
          <label>Ghi chú</label>
          <textarea id="fNote" rows="2" placeholder="............."></textarea>
        </div>
        <div class="form-group full">
          <label>📷 Ảnh kết quả thí nghiệm</label>
          <input type="file" id="fResultImgs" accept="image/*" multiple
                 onchange="handleImgPick(this,'result')">
          <div class="img-preview" id="resultPreview"></div>
        </div>
        <div class="form-group full">
          <label>🏷️ Ảnh nameplate</label>
          <input type="file" id="fNameplateImgs" accept="image/*" multiple
                 onchange="handleImgPick(this,'nameplate')">
          <div class="img-preview" id="nameplatePreview"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-danger" onclick="closeModal()">Hủy</button>
        <button type="submit" class="btn-primary" id="btnSave">💾 Lưu</button>
      </div>
    </form>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="close-lb">&times;</span>
  <img id="lightboxImg" src="">
</div>
<div class="toast" id="toast"></div>

<script>
/* ⬇ DÁN URL WEB APP CỦA BẠN VÀO ĐÂY ⬇ */
const API_URL = 'https://script.google.com/macros/s/AKfycbzUm3S8moauD2tmRPo2O2toJoR2-tykL6lFv_5ZTb9xvv0YOIcJ-jpjfV_khHRAvIdJ/exec'; 

let equipmentList = [];
let stations = [];
let tempResultImgs = [];
let tempNameplateImgs = [];
let dirty = false;
let syncTimer = null;

function toast(msg, type=''){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.className='toast', 4000); // Tăng thời gian hiện lỗi
}
function setSyncState(state, text){
  const bar = document.getElementById('syncBar');
  bar.className = 'sync-bar' + (state==='dirty'?' dirty':state==='error'?' error':'');
  document.getElementById('syncText').textContent = text;
  document.getElementById('btnSync').disabled = (state !== 'dirty');
}
function markDirty(){
  dirty = true;
  setSyncState('dirty', '⚠️ Có thay đổi chưa đồng bộ');
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>{ if(dirty) syncNow(); }, 60000);
}
function uid(p='id'){ return p + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }
function fmtDate(d){
  if(!d) return '';
  const s = String(d).split('T')[0];
  const [y,m,dd] = s.split('-');
  return dd && m && y ? `${dd}/${m}/${y}` : s;
}
function dateOnly(d){ return d ? String(d).split('T')[0] : ''; }
function monthKey(d){ const s = dateOnly(d); return s ? s.slice(0,7) : 'Chưa có'; }

/* NÉN ẢNH */
const IMG_CONFIG = { result: { maxDim: 1200, quality: 0.72 }, nameplate: { maxDim: 1400, quality: 0.80 } };
function fileToDataUrl(fileOrBlob){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = e=>resolve(e.target.result);
    r.onerror = ()=>reject(new Error('FileReader error'));
    r.readAsDataURL(fileOrBlob);
  });
}
async function compressImage(file, type='result'){
  const cfg = IMG_CONFIG[type] || IMG_CONFIG.result;
  let bitmap;
  try { bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch(e){
    bitmap = await new Promise((resolve, reject)=>{
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
      img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('Decode fail')); };
      img.src = url;
    });
  }
  const srcW = bitmap.width || bitmap.naturalWidth;
  const srcH = bitmap.height || bitmap.naturalHeight;
  if(srcW <= cfg.maxDim && srcH <= cfg.maxDim && file.size < 400*1024 && file.type === 'image/jpeg'){
    if(bitmap.close) bitmap.close();
    const dataUrl = await fileToDataUrl(file);
    return { base64: dataUrl.split(',')[1], dataUrl, type:'image/jpeg', name: file.name.replace(/\.[^.]+$/, '') + '.jpg', originalKB: Math.round(file.size/1024), compressedKB: Math.round(dataUrl.length*0.75/1024), skipped: true };
  }
  const scale = Math.min(1, cfg.maxDim / Math.max(srcW, srcH));
  const w = Math.round(srcW * scale), h = Math.round(srcH * scale);
  let canvas, ctx;
  if(typeof OffscreenCanvas !== 'undefined'){ canvas = new OffscreenCanvas(w, h); ctx = canvas.getContext('2d', { alpha: false }); }
  else { canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h; ctx = canvas.getContext('2d', { alpha: false }); }
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bitmap, 0, 0, w, h);
  if(bitmap.close) bitmap.close();
  let dataUrl;
  if(canvas.convertToBlob){ const blob = await canvas.convertToBlob({ type:'image/jpeg', quality: cfg.quality }); dataUrl = await fileToDataUrl(blob); }
  else { dataUrl = canvas.toDataURL('image/jpeg', cfg.quality); }
  return { base64: dataUrl.split(',')[1], dataUrl, type:'image/jpeg', name: file.name.replace(/\.[^.]+$/, '') + '.jpg', originalKB: Math.round(file.size/1024), compressedKB: Math.round(dataUrl.length*0.75/1024) };
}
async function processWithLimit(items, fn, concurrency = 3){
  const results = new Array(items.length); let idx = 0;
  async function worker(){ while(idx < items.length){ const i = idx++; results[i] = await fn(items[i], i); } }
  const workers = Array.from({ length: Math.min(concurrency, items.length) }, worker);
  await Promise.all(workers); return results;
}

/* API */
async function apiPost(payload){
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload),
    redirect: 'follow'
  });
  const text = await res.text();
  try {
    const json = JSON.parse(text);
    if(!json.success) throw new Error(json.error || 'API error');
    return json.data;
  } catch (e) {
    console.error("Server Response:", text);
    throw new Error("Lỗi kết nối Server. Kiểm tra lại URL Web App hoặc quyền.");
  }
}
async function uploadImageToDrive(img){
  return await apiPost({action:'uploadImage', data: img.base64, type: img.type, name: img.name});
}
function driveImageUrl(fileId, size=200){ return `https://drive.google.com/thumbnail?id=${fileId}&sz=w${size}`; }

/* LOAD */
async function loadFromServer(showToast=false){
  try{
    setSyncState('', '⏳ Loading...');
    const res = await fetch(API_URL + '?action=getAll&t=' + Date.now());
    const json = await res.json();
    if(!json.success) throw new Error(json.error);
    const d = json.data;
    stations = (d.stations || []).map(s=>({ ...s, name: (s.name||'').trim().toUpperCase() }));
    equipmentList = (d.devices || []).map(dev=>{
      const st = stations.find(s=>s.id === dev.stationId);
      let imgs = { result: [], nameplate: [] };
      try {
        if (typeof dev.images === 'string') imgs = JSON.parse(dev.images);
        else if (dev.images) imgs = dev.images;
      } catch(e){}
      return {
        ...dev,
        stationName: (st ? st.name : '').toUpperCase(),
        code: (dev.code||'').trim().toUpperCase(),
        name: (dev.name||'').trim().toUpperCase(),
        resultImages:    Array.isArray(imgs.result)    ? imgs.result    : [],
        nameplateImages: Array.isArray(imgs.nameplate) ? imgs.nameplate : [],
        reportStatus: dev.reportStatus || 'Chưa làm',
        _synced: true
      };
    });
    dirty = false; render(); renderDashboard();
    setSyncState('', '✅ Đã tải ' + equipmentList.length + ' thiết bị từ Sheet');
    if(showToast) toast('Đã tải lại dữ liệu', 'success');
  }catch(err){
    setSyncState('error', '❌ Lỗi tải: ' + err.message);
    toast('Lỗi tải: ' + err.message, 'error');
  }
}

/* STATION & AUTOCOMPLETE */
async function ensureStation(name){
  const norm = (name||'').trim().toUpperCase();
  if(!norm) return null;
  let found = stations.find(s=>(s.name||'').toUpperCase() === norm);
  if(found){
    if(found.name !== norm){
      try{ await apiPost({action:'saveStation', record:{...found, name: norm}}); found.name = norm; }catch(e){}
    }
    return found;
  }
  const newSt = { id: uid('st'), code: norm.replace(/\s+/g,'_').slice(0,30), name: norm, address: '', note: '' };
  await apiPost({action:'saveStation', record: newSt});
  stations.push(newSt); return newSt;
}
function getAllStationNames(){
  const fromSheet = (stations||[]).map(s=>(s.name||'').trim().toUpperCase()).filter(Boolean);
  const fromDevices = (equipmentList||[]).map(d=>(d.stationName||'').trim().toUpperCase()).filter(Boolean);
  return [...new Set([...fromSheet, ...fromDevices])].sort((a,b)=>a.localeCompare(b,'vi'));
}
function onStationFocus(){ showStationDropdown(document.getElementById('fStation').value); }
function onStationInput(val){ showStationDropdown(val); }
function showStationDropdown(filter){
  const all = getAllStationNames();
  const f = (filter||'').trim().toUpperCase();
  const matches = f ? all.filter(s=>s.includes(f)) : all;
  const dd = document.getElementById('stationDropdown');
  let html = '';
  if(matches.length > 0){
    html += matches.map(s=>{
      let display = s;
      if(f){ const i = s.indexOf(f); if(i >= 0){ display = s.slice(0,i) + '<strong style="color:#dc3545">' + s.slice(i,i+f.length) + '</strong>' + s.slice(i+f.length); } }
      const safe = s.replace(/'/g,"\\'");
      return `<div class="ac-item" onmousedown="pickStation(event,'${safe}')">🏢 ${display} <span class="ac-count">trong DS</span></div>`;
    }).join('');
  }
  if(f && !all.includes(f)){
    const safe = f.replace(/'/g,"\\'");
    html += `<div class="ac-item new" onmousedown="pickStation(event,'${safe}')">➕ Tạo trạm mới: "${f}"</div>`;
  }
  if(!html){ html = `<div class="ac-empty">${all.length===0 ? 'Chưa có trạm nào. Gõ tên trạm mới để tạo.' : 'Không khớp. Gõ tên mới để tạo trạm.'}</div>`; }
  dd.innerHTML = html; dd.classList.add('show');
}
function pickStation(ev, name){ if(ev) ev.preventDefault(); document.getElementById('fStation').value = name.toUpperCase(); document.getElementById('stationDropdown').classList.remove('show'); }
function toggleStationList(ev){ if(ev) ev.preventDefault(); const dd = document.getElementById('stationDropdown'); if(dd.classList.contains('show')){ dd.classList.remove('show'); } else { document.getElementById('fStation').focus(); showStationDropdown(document.getElementById('fStation').value); } }

/* SYNC */
async function syncNow(){
  if(!dirty) return;
  const btn = document.getElementById('btnSync');
  btn.disabled = true; btn.textContent = '⏳ Đang đồng bộ...';
  try{
    const uniqueStations = [...new Set(equipmentList.map(d=>(d.stationName||'').trim().toUpperCase()).filter(Boolean))];
    for(const name of uniqueStations) await ensureStation(name);

    for(const dev of equipmentList){
      if(dev._synced !== false) continue;

      // Tự động upload lại ảnh nếu lỗi mạng
      const allImgs = [...(dev.resultImages||[]), ...(dev.nameplateImages||[])];
      for(const img of allImgs){
        if(!img.fileId && img.dataUrl){
          try {
            const base64 = img.dataUrl.split(',')[1];
            const up = await uploadImageToDrive({base64, type:'image/jpeg', name: img.name||'img.jpg'});
            img.fileId = up.fileId;
            img.dataUrl = null;
          } catch(e) {
            throw new Error("Lỗi upload ảnh Drive: " + e.message);
          }
        }
      }

      const st = stations.find(s=>(s.name||'').toUpperCase() === (dev.stationName||'').toUpperCase());
      
      const rec = {
        id: dev.id,
        stationId: st ? st.id : '',
        code: String(dev.code||'').toUpperCase(),
        name: dev.name || '',
        // ✅ BỔ SUNG 3 DÒNG QUAN TRỌNG NÀY:
        samplingDate: dev.samplingDate || '',
        testDate:     dev.testDate || '',
        reportStatus: dev.reportStatus || 'Chưa làm',
        
        type: '', model: '', serial: '', manufacturer: '', year: '', installDate: '', location: '',
        note: dev.note || '',
        images: {
          result: dev.resultImages || [],
          nameplate: dev.nameplateImages || []
        }
      };
      await apiPost({action:'saveDevice', record: rec});
      dev._synced = true;
      dev.stationId = rec.stationId;
    }
    dirty = false;
    setSyncState('', '✅ Đã đồng bộ lúc ' + new Date().toLocaleTimeString('vi-VN'));
    toast('Đồng bộ thành công', 'success');
    renderDashboard();
  }catch(err){
    setSyncState('error', '❌ Lỗi sync: ' + err.message);
    toast('Lỗi đồng bộ: ' + err.message, 'error');
  }finally{
    btn.textContent = '☁️ Đồng bộ ngay';
    btn.disabled = !dirty;
  }
}

/* FILTER & RENDER LIST */
function getFilteredList(){
  const search = document.getElementById('searchBox').value.toLowerCase().trim();
  const fStation = document.getElementById('filterStation').value;
  const fReport = document.getElementById('filterReport').value;
  const df = document.getElementById('filterDateField').value;
  const dFrom = document.getElementById('filterDateFrom').value;
  const dTo = document.getElementById('filterDateTo').value;
  return equipmentList.filter(e=>{
    if(search){
      const hay = [e.name, e.code, e.stationName, e.note].map(x=>(x||'').toLowerCase()).join(' ');
      if(!hay.includes(search)) return false;
    }
    if(fStation && e.stationName !== fStation) return false;
    if(fReport && (e.reportStatus||'Chưa làm') !== fReport) return false;
    if(dFrom || dTo){
      const val = dateOnly(e[df] || '');
      if(!val) return false;
      if(dFrom && val < dFrom) return false;
      if(dTo && val > dTo) return false;
    }
    return true;
  });
}
function clearDateFilter(){ document.getElementById('filterDateFrom').value = ''; document.getElementById('filterDateTo').value = ''; render(); }

    tbody.innerHTML = filtered.map((e,i)=>{
      const rc = e.reportStatus === 'Đã xong' ? 'badge-green' : e.reportStatus === 'Đang làm' ? 'badge-yellow' : 'badge-red';

      const nImgs = (e.nameplateImages||[]).slice(0,2).map(buildThumb).join('') || '<div class="thumb-empty">Trống</div>';

/* DASHBOARD */
function renderDashboard(){
  const byStation = {}, byMonth = {}, matrix = {};
  equipmentList.forEach(d=>{
    const st = (d.stationName||'(Chưa có trạm)').trim() || '(Chưa có trạm)';
    const rs = d.reportStatus || 'Chưa làm';
    const dStr = d.testDate || d.samplingDate;
    const mk = monthKey(dStr);

    if(!byStation[st]) byStation[st] = {total:0, chuaLam:0, dangLam:0, daXong:0};
    byStation[st].total++;
    if(rs==='Đã xong') byStation[st].daXong++;
    else if(rs==='Đang làm') byStation[st].dangLam++;
    else byStation[st].chuaLam++;

    if(!byMonth[mk]) byMonth[mk] = {total:0, chuaLam:0, dangLam:0, daXong:0};
    byMonth[mk].total++;
    if(rs==='Đã xong') byMonth[mk].daXong++;
    else if(rs==='Đang làm') byMonth[mk].dangLam++;
    else byMonth[mk].chuaLam++;

    if(!matrix[st]) matrix[st] = {};
    if(!matrix[st][mk]) matrix[st][mk] = {total:0, done:0};
    matrix[st][mk].total++;
    if(rs==='Đã xong') matrix[st][mk].done++;
  });

  const stKeys = Object.keys(byStation).sort();
  if(stKeys.length === 0) document.getElementById('dashByStation').innerHTML = '<p style="color:#999;padding:20px;text-align:center">Chưa có dữ liệu</p>';
  else {
    let sumT=0, sumC=0, sumD=0, sumX=0;
    const rows = stKeys.map(st=>{
      const r = byStation[st];
      sumT+=r.total; sumC+=r.chuaLam; sumD+=r.dangLam; sumX+=r.daXong;
      const pct = r.total ? Math.round(r.daXong*100/r.total) : 0;
      const pctClass = pct>=80?'pct-good':pct>=40?'pct-warn':'pct-bad';
      return `<tr><td>${st}</td><td class="num-big">${r.total}</td><td style="color:#dc3545">${r.chuaLam}</td><td style="color:#ffc107">${r.dangLam}</td><td style="color:#28a745">${r.daXong}</td><td class="${pctClass}">${pct}%<span class="progress"><div style="width:${pct}%"></div></span></td></tr>`;
    }).join('');
    const pctAll = sumT ? Math.round(sumX*100/sumT) : 0;
    document.getElementById('dashByStation').innerHTML = `<table class="dash-table"><thead><tr><th>Trạm</th><th>Tổng</th><th>Chưa làm</th><th>Đang làm</th><th>Đã xong</th><th>% HT</th></tr></thead><tbody>${rows}<tr class="total-row"><td>TỔNG CỘNG</td><td class="num-big">${sumT}</td><td>${sumC}</td><td>${sumD}</td><td>${sumX}</td><td>${pctAll}%</td></tr></tbody></table>`;
  }

  const mKeys = Object.keys(byMonth).sort();
  if(mKeys.length === 0) document.getElementById('dashByMonth').innerHTML = '<p style="color:#999;padding:20px;text-align:center">Chưa có dữ liệu</p>';
  else {
    const rows = mKeys.map(mk=>{
      const r = byMonth[mk];
      const pct = r.total ? Math.round(r.daXong*100/r.total) : 0;
      const pctClass = pct>=80?'pct-good':pct>=40?'pct-warn':'pct-bad';
      const label = mk==='Chưa có' ? 'Chưa có ngày' : mk;
      return `<tr><td>${label}</td><td class="num-big">${r.total}</td><td style="color:#dc3545">${r.chuaLam}</td><td style="color:#ffc107">${r.dangLam}</td><td style="color:#28a745">${r.daXong}</td><td class="${pctClass}">${pct}%</td></tr>`;
    }).join('');
    document.getElementById('dashByMonth').innerHTML = `<table class="dash-table"><thead><tr><th>Tháng</th><th>Tổng</th><th>Chưa làm</th><th>Đang làm</th><th>Đã xong</th><th>% HT</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  const allMonths = [...new Set(Object.values(matrix).flatMap(o=>Object.keys(o)))].sort();
  if(stKeys.length === 0 || allMonths.length === 0) document.getElementById('dashMatrix').innerHTML = '<p style="color:#999;padding:20px;text-align:center">Chưa có dữ liệu</p>';
  else {
    const header = `<tr><th>Trạm \\ Tháng</th>${allMonths.map(m=>`<th>${m==='Chưa có'?'—':m}</th>`).join('')}<th>Tổng</th></tr>`;
    const rows = stKeys.map(st=>{
      const rowCells = allMonths.map(m=>{
        const cell = (matrix[st]||{})[m];
        if(!cell) return '<td style="color:#ddd">—</td>';
        const pct = Math.round(cell.done*100/cell.total);
        const cls = pct===100?'pct-good':pct>0?'pct-warn':'pct-bad';
        return `<td class="${cls}">${cell.done}/${cell.total}</td>`;
      }).join('');
      return `<tr><td>${st}</td>${rowCells}<td class="num-big">${byStation[st].total}</td></tr>`;
    }).join('');
    const colTotals = allMonths.map(m=>{
      const t = stKeys.reduce((s,st)=>s + ((matrix[st]||{})[m]?.total||0), 0);
      const d = stKeys.reduce((s,st)=>s + ((matrix[st]||{})[m]?.done||0), 0);
      return `<td class="num-big">${d}/${t}</td>`;
    }).join('');
    document.getElementById('dashMatrix').innerHTML = `<table class="dash-table"><thead>${header}</thead><tbody>${rows}<tr class="total-row"><td>TỔNG</td>${colTotals}<td>${equipmentList.length}</td></tr></tbody></table>`;
  }
}

async function handleImgPick(input, type){
  const files = Array.from(input.files);
  input.value = '';
  if(!files.length) return;
  const arr = type==='result' ? tempResultImgs : tempNameplateImgs;
  const items = files.map(file=>{
    const ph = { fileId: null, dataUrl: null, name: file.name, uploading: true, progress: 'Đang nén...', progType: '' };
    arr.push(ph); return { file, ph };
  });
  renderPreviews();

  let totalOriginal = 0, totalCompressed = 0, okCount = 0, errCount = 0;

  await processWithLimit(items, async ({file, ph})=>{
    try{
      ph.progress = 'Đang nén...'; ph.progType = ''; renderPreviews();
      const compressed = await compressImage(file, type);
      totalOriginal += compressed.originalKB; totalCompressed += compressed.compressedKB;
      ph.dataUrl = compressed.dataUrl;
      ph.originalKB = compressed.originalKB; ph.compressedKB = compressed.compressedKB;
      
      ph.progress = 'Đang upload...'; renderPreviews();
      const up = await uploadImageToDrive(compressed);
      ph.fileId = up.fileId; ph.name = up.name; ph.uploading = false;
      ph.progress = `✓ ${compressed.originalKB}→${compressed.compressedKB}KB`; ph.progType = 'ok';
      okCount++;
    } catch(err){
      console.warn('Lỗi upload:', err);
      if(ph.dataUrl){
        ph.uploading = false; ph.progress = '⚠ Lỗi Drive, giữ local'; ph.progType = 'err';
      } else {
        const i = arr.indexOf(ph); if(i >= 0) arr.splice(i, 1); errCount++;
      }
    }
    renderPreviews();
  }, 3);

  if(okCount > 0){
    const saved = totalOriginal > 0 ? Math.round((1 - totalCompressed/totalOriginal) * 100) : 0;
    toast(`${okCount} ảnh OK: ${totalOriginal}KB → ${totalCompressed}KB (-${saved}%)`, 'success');
  }
  if(errCount > 0) toast(`${errCount} ảnh không xử lý được`, 'error');
}

function renderPreviews(){
  const build = (list, kind) => list.map((img,i)=>{
    const localSrc = img.dataUrl && img.dataUrl.startsWith('data:') ? img.dataUrl : null;
    const driveSrc = img.fileId ? driveImageUrl(img.fileId, 150) : null;
    const src = localSrc || driveSrc;
    const imgTag = src ? `<img src="${src}" onclick="openLightbox('${img.fileId||''}','${src}')">` : `<div class="ph">⏳</div>`;
    const prog = img.progress ? `<span class="prog ${img.progType||''}">${img.progress}</span>` : '';
    return `<div class="img-wrap ${img.uploading?'uploading':''}" title="${img.name||''}">${imgTag}${prog}<button type="button" class="del-img" onclick="removeImg('${kind}',${i})">&times;</button></div>`;
  }).join('');
  document.getElementById('resultPreview').innerHTML = build(tempResultImgs, 'result');
  document.getElementById('nameplatePreview').innerHTML = build(tempNameplateImgs, 'nameplate');
}
function removeImg(type, idx){
  if(type==='result') tempResultImgs.splice(idx,1);
  else tempNameplateImgs.splice(idx,1);
  renderPreviews();
}

/* SAVE */
function saveEquipment(ev){
  ev.preventDefault();
  const id = document.getElementById('eqId').value || uid('dev');
  const stationName = document.getElementById('fStation').value.trim().toUpperCase();
  const code = document.getElementById('fCode').value.trim().toUpperCase();
  const name = document.getElementById('fName').value.trim().toUpperCase();

  if(!stationName){ toast('Trạm bắt buộc', 'error'); return; }
  if(!code){ toast('Mã thiết bị bắt buộc', 'error'); return; }

  const dup = equipmentList.find(x=>x.id !== id && (x.code||'').toUpperCase() === code && (x.stationName||'').toUpperCase() === stationName);
  if(dup){ toast(`Mã "${code}" đã tồn tại trong trạm "${stationName}"`, 'error'); return; }

  const cleanImgs = (arr) => arr
    .filter(i=>i.fileId || (i.dataUrl && !i.uploading))
    .map(i=>({
      fileId: i.fileId || null,
      name: i.name || '',
      dataUrl: i.fileId ? null : i.dataUrl,
      originalKB: i.originalKB,
      compressedKB: i.compressedKB
    }));

  const data = {
    id, stationName, code, name,
    samplingDate: document.getElementById('fSamplingDate').value,
    testDate:     document.getElementById('fTestDate').value,
    reportStatus: document.getElementById('fReport').value,
    note:         document.getElementById('fNote').value.trim(),
    resultImages:    cleanImgs(tempResultImgs),
    nameplateImages: cleanImgs(tempNameplateImgs),
    _synced: false
  };

  const idx = equipmentList.findIndex(x=>x.id===id);
  if(idx>=0) equipmentList[idx] = {...equipmentList[idx], ...data};
  else equipmentList.push(data);

  render(); closeModal(); markDirty();
  toast('Đã lưu – đang đồng bộ...', 'success');
  setTimeout(()=>syncNow(), 300);
}

function deleteEquipment(id){
  if(!confirm('Xóa thiết bị này? (sẽ xóa cả trên Sheet)')) return;
  (async()=>{
    try{
      await apiPost({action:'deleteDevice', id});
      equipmentList = equipmentList.filter(x=>x.id!==id);
      render(); renderDashboard(); toast('Đã xóa', 'success');
    }catch(err){ toast('Lỗi xóa: ' + err.message, 'error'); }
  })();
}
